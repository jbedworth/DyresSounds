<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Dyre's Sounds</title>
  <desc id="description">An original emblem: a pair of beamed gold notes glowing with warm light, between segmented arcs of sound that fade outward, on a rich dark-brown field framed by a fine gold border.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#49301c"/>
      <stop offset="0.6" stop-color="#2b190f"/>
      <stop offset="1" stop-color="#170e09"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d38b"/>
      <stop offset="0.32" stop-color="#d5a956"/>
      <stop offset="0.64" stop-color="#96703a"/>
      <stop offset="1" stop-color="#e9bf6a"/>
    </linearGradient>
    <linearGradient id="holy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="0.45" stop-color="#f3e3b0"/>
      <stop offset="1" stop-color="#b9954f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7fb8"/>
      <stop offset="1" stop-color="#1d2c5a"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.5" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#b9954f"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="1" stop-color="#cfe9ff"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.32"/>
      <stop offset="0.7" stop-color="#c9a24f" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3a2410" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#fff2c4"/>
      <stop offset="1" stop-color="#d6a446"/>
    </radialGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#080502" flood-opacity="0.7"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <path d="M0 0H1024V1024H0Z" fill="url(#background)"/>
  <rect x="46" y="46" width="932" height="932" rx="94" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <rect x="62" y="62" width="900" height="900" rx="80" fill="none" stroke="#b48b45" stroke-opacity="0.28" stroke-width="2"/>
  <path d="M512 91 L525 108 L512 125 L499 108 Z M512 899 L525 916 L512 933 L499 916 Z" fill="url(#gold)"/>
  <!-- A warm aura behind the emblem. -->
  <circle cx="512" cy="480" r="360" fill="url(#aura)"/>
  <g filter="url(#shadow)">
    <!-- Glow pass: the notes blurred, then drawn sharp on top. -->
    <g filter="url(#glow)" opacity="0.55" fill="#ffe7a0">
      <path d="M480 626 L480 318 L502 314 L502 622 Z M664 590 L664 282 L686 278 L686 586 Z M480 318 L686 278 L686 336 L480 376 Z M480 400 L686 360 L686 402 L480 442 Z"/><ellipse cx="0" cy="0" rx="64" ry="46" transform="translate(436 640) rotate(-22)"/><ellipse cx="0" cy="0" rx="64" ry="46" transform="translate(620 604) rotate(-22)"/>
    </g>
    <!-- Sound waves, segmented like the shield crescent, fading outward. -->
    <path d="M778.1 394.8 A140 140 0 0 1 796.5 438.9 L775.1 443.8 A118 118 0 0 0 759.5 406.6 Z M797.9 446.1 A140 140 0 0 1 797.9 493.9 L776.3 490.2 A118 118 0 0 0 776.3 449.8 Z M796.5 501.1 A140 140 0 0 1 778.1 545.2 L759.5 533.4 A118 118 0 0 0 775.1 496.2 Z M227.5 438.9 A140 140 0 0 1 245.9 394.8 L264.5 406.6 A118 118 0 0 0 248.9 443.8 Z M226.1 493.9 A140 140 0 0 1 226.1 446.1 L247.7 449.8 A118 118 0 0 0 247.7 490.2 Z M245.9 545.2 A140 140 0 0 1 227.5 501.1 L248.9 496.2 A118 118 0 0 0 264.5 533.4 Z" fill="url(#arc)" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M835.8 374.6 A200 200 0 0 1 851.8 413.2 L830.7 419.4 A178 178 0 0 0 816.4 385.1 Z M854.5 423.3 A200 200 0 0 1 859.9 464.8 L837.9 465.3 A178 178 0 0 0 833.1 428.4 Z M859.9 475.2 A200 200 0 0 1 854.5 516.7 L833.1 511.6 A178 178 0 0 0 837.9 474.7 Z M851.8 526.8 A200 200 0 0 1 835.8 565.4 L816.4 554.9 A178 178 0 0 0 830.7 520.6 Z M172.2 413.2 A200 200 0 0 1 188.2 374.6 L207.6 385.1 A178 178 0 0 0 193.3 419.4 Z M164.1 464.8 A200 200 0 0 1 169.5 423.3 L190.9 428.4 A178 178 0 0 0 186.1 465.3 Z M169.5 516.7 A200 200 0 0 1 164.1 475.2 L186.1 474.7 A178 178 0 0 0 190.9 511.6 Z M188.2 565.4 A200 200 0 0 1 172.2 526.8 L193.3 520.6 A178 178 0 0 0 207.6 554.9 Z" fill="url(#arc)" fill-opacity="0.7" stroke="url(#gold)" stroke-opacity="0.8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M896.6 362.2 A260 260 0 0 1 908.5 393.5 L887.5 400.0 A238 238 0 0 0 876.6 371.3 Z M912.2 406.7 A260 260 0 0 1 918.2 439.7 L896.4 442.2 A238 238 0 0 0 890.8 412.0 Z M919.5 453.2 A260 260 0 0 1 919.5 486.8 L897.5 485.4 A238 238 0 0 0 897.5 454.6 Z M918.2 500.3 A260 260 0 0 1 912.2 533.3 L890.8 528.0 A238 238 0 0 0 896.4 497.8 Z M908.5 546.5 A260 260 0 0 1 896.6 577.8 L876.6 568.7 A238 238 0 0 0 887.5 540.0 Z M115.5 393.5 A260 260 0 0 1 127.4 362.2 L147.4 371.3 A238 238 0 0 0 136.5 400.0 Z M105.8 439.7 A260 260 0 0 1 111.8 406.7 L133.2 412.0 A238 238 0 0 0 127.6 442.2 Z M104.5 486.8 A260 260 0 0 1 104.5 453.2 L126.5 454.6 A238 238 0 0 0 126.5 485.4 Z M111.8 533.3 A260 260 0 0 1 105.8 500.3 L127.6 497.8 A238 238 0 0 0 133.2 528.0 Z M127.4 577.8 A260 260 0 0 1 115.5 546.5 L136.5 540.0 A238 238 0 0 0 147.4 568.7 Z" fill="#0d1426" fill-opacity="0.6" stroke="#b48b45" stroke-opacity="0.55" stroke-width="3"/>
    <!-- The notes: gold, with a fine bright edge. -->
    <g fill="url(#note)" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round">
      <path d="M480 626 L480 318 L502 314 L502 622 Z M664 590 L664 282 L686 278 L686 586 Z M480 318 L686 278 L686 336 L480 376 Z M480 400 L686 360 L686 402 L480 442 Z"/><ellipse cx="0" cy="0" rx="64" ry="46" transform="translate(436 640) rotate(-22)"/><ellipse cx="0" cy="0" rx="64" ry="46" transform="translate(620 604) rotate(-22)"/>
    </g>
    <ellipse cx="0" cy="0" rx="26" ry="12" transform="translate(420 626) rotate(-22)" fill="#fffbea" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="26" ry="12" transform="translate(604 590) rotate(-22)" fill="#fffbea" opacity="0.7"/>
    <!-- Fine outer and inner rings, as on the other Dyre's logos. -->
    <circle cx="512" cy="480" r="338" fill="none" stroke="#f0ca78" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="512" cy="480" r="350" fill="none" stroke="#b48b45" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 12"/>
    <!-- Three small sparkles drifting off the emblem. -->
    <g fill="#fff4d6">
      <path d="M262 286 Q265 303 282 306 Q265 309 262 326 Q259 309 242 306 Q259 303 262 286 Z"/>
      <path d="M268 650 Q270 662 282 664 Q270 666 268 678 Q266 666 254 664 Q266 662 268 650 Z"/>
      <path d="M856 300 Q858 309 867 311 Q858 313 856 322 Q854 313 845 311 Q854 309 856 300 Z"/>
    </g>
  </g>
  <path d="M359 850H457 M567 850H665" fill="none" stroke="#b98e47" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
  <path d="M512 837 L524 850 L512 863 L500 850 Z" fill="url(#gold)"/>
</svg>
